name: Run on x86
description: Run a shell command in a Debian 12 i386 container with GTK3 and Xvfb

inputs:
  command:
    description: 'Command to run'
    required: true
    default: 'lsb_release -a'

runs:
  using: 'composite'
  steps:
    - name: Set up Buildx
      uses: docker/setup-buildx-action@v3

    # The image is only rebuilt when its Dockerfile changes. On every other run
    # the layers (including the apt install of GTK3/Xvfb) are restored from the
    # GitHub Actions cache, so the Ubuntu mirrors are not touched at all.
    - name: Build image
      uses: docker/build-push-action@v6
      with:
        context: ${{ github.action_path }}
        load: true
        tags: ci-linux-gtk:local
        cache-from: type=gha,scope=ci-linux-gtk
        cache-to: type=gha,scope=ci-linux-gtk

    - name: Run command
      shell: bash
      env:
        CI_IMAGE: ci-linux-gtk:local
        CI_COMMAND: ${{ inputs.command }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/ci-home"
        docker run --rm \
          -v "$GITHUB_WORKSPACE:/github/workspace" \
          -v "$RUNNER_TEMP/ci-home:/github/home" \
          -w /github/workspace \
          -e HOME=/github/home \
          -e CI=true \
          "$CI_IMAGE" "$CI_COMMAND"
