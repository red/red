name: Run on x86
description: Run a shell command in a Debian 12 i386 container

inputs:
  command:
    description: 'Command to run'
    required: true
    default: 'lsb_release -a'

runs:
  using: 'composite'
  steps:
    - name: Set up Buildx
      uses: docker/setup-buildx-action@v4

    # The image is only rebuilt when its Dockerfile changes. On every other run
    # the layers are restored from the GitHub Actions cache, so building costs
    # a couple of seconds and needs no network access.
    - name: Build image
      uses: docker/build-push-action@v7
      with:
        context: ${{ github.action_path }}
        load: true
        tags: ci-linux-32:local
        cache-from: type=gha,scope=ci-linux-32
        # A cache export failure (e.g. the cache service throttling) must not
        # fail the step: the image is built and loaded regardless.
        cache-to: type=gha,scope=ci-linux-32,ignore-error=true

    - name: Run command
      shell: bash
      env:
        CI_IMAGE: ci-linux-32:local
        CI_COMMAND: ${{ inputs.command }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/ci-home"
        docker run --rm \
          -v "$GITHUB_WORKSPACE:/github/workspace" \
          -v "$RUNNER_TEMP/ci-home:/github/home" \
          -w /github/workspace \
          -e HOME=/github/home \
          -e CI=true \
          "$CI_IMAGE" "$CI_COMMAND"
