name: AI Review

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # AI-based review on the Linux self-hosted runner. Advisory: it reads the
  # pushed range, writes its report to runner.temp, uploads the ai-review
  # artifact, and notifies Telegram. Authentication: the reviewer prefers the
  # Vercel AI Gateway via the AI_GATEWAY_API_KEY secret; when the secret is not
  # configured the script unsets it so the reviewer falls back to credentials
  # saved on the runner machine (see the CLI's authentication docs).
  review:
    name: Review pushed diff
    runs-on: [self-hosted, Linux, X64, codex-review]
    continue-on-error: true
    # Backstop only; the review step enforces its own shorter deadline and
    # exits cleanly instead (see the comment in review-push.sh).
    timeout-minutes: 90
    outputs:
      has_issues: ${{ steps.run_review.outputs.has_issues }}
      review_output_path: ${{ steps.run_review.outputs.review_output_path }}
      transcript_path: ${{ steps.run_review.outputs.transcript_path }}
      last_message_path: ${{ steps.run_review.outputs.last_message_path }}
      range_label: ${{ steps.run_review.outputs.range_label }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run AI review
        id: run_review
        shell: bash
        continue-on-error: true
        env:
          REVIEW_BEFORE: ${{ github.event.before }}
          REVIEW_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          # Bearer token for the custom provider (CLI settings.json
          # on the runner reads it via auth.bearer.env). Never stored on the
          # runner machine; add it with `gh secret set CUSTOM_API_KEY`.
          CUSTOM_API_KEY: ${{ secrets.CUSTOM_API_KEY }}
          # Reasoning effort for the reviewer (low/medium/high/...); set the
          # repository variable REVIEW_EFFORT to override, empty = the model's
          # default.
          REVIEW_EFFORT: ${{ vars.REVIEW_EFFORT }}
        run: |
          bash .github/scripts/review-push.sh

      - name: Upload review log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ai-review
          path: |
            ${{ runner.temp }}/review-output.md
            ${{ runner.temp }}/review-last-message.md
            ${{ runner.temp }}/review-transcript.txt
          if-no-files-found: ignore

      - name: Send Telegram review report
        if: steps.run_review.outputs.has_issues == 'true'
        continue-on-error: true
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          shortSha="${GITHUB_SHA:0:12}"
          runUrl="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          message="$(printf 'AI review found issues.\n\nRepository: %s\nBranch: %s\nCommit: %s\nRange: %s\nRun: %s' \
            "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$shortSha" \
            "${{ steps.run_review.outputs.range_label }}" "$runUrl")"
          bash .github/scripts/send-telegram-review.sh \
            "${{ steps.run_review.outputs.review_output_path }}" \
            "$message"
          exit 0
